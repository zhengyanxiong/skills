name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skills Repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make CLI executable
        run: chmod +x skills skills.py

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run skills.py doctor
        run: python3 skills.py doctor

      # pytest, not `unittest discover`: the pytest-style test modules
      # (tests/test_skills.py) are plain classes, which unittest silently skips.
      - name: Run unit tests
        run: python3 -m pytest tests/ -v

      - name: Verify manifest consistency
        run: |
          echo "Listing all local skills..."
          python3 skills.py list > /tmp/skills-list.txt
          echo "First 10 skills:"
          head -10 /tmp/skills-list.txt

      - name: Check for untracked skills (info)
        run: |
          # Skills in directory but missing from manifest
          missing=$(python3 -c "
          import json, os
          manifest = json.load(open('skills.manifest.json'))['skills']
          for d in sorted(os.listdir('.')):
              if os.path.isfile(os.path.join(d, 'SKILL.md')) and d not in manifest:
                  print(d)
          " || true)
          if [ -n "$missing" ]; then
            echo "⚠️  Warning: Skills with SKILL.md but not in manifest:"
            echo "$missing"
            echo "(This is informational — local skills may exist without manifest entry)"
          else
            echo "✅ All SKILL.md files are tracked in manifest."
          fi

  lint:
    name: Lint CLI Tool
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check skills.py
        run: python3 -m py_compile skills.py && echo "✅ skills.py compiles cleanly"

      - name: Check Python syntax for tests
        run: |
          find tests -name "test_*.py" -exec python3 -m py_compile {} \; && \
            echo "✅ All test files compile cleanly"

  matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run unit tests on Python ${{ matrix.python-version }}
        run: python3 -m pytest tests/ -v

  windows:
    name: Windows (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run skills.py doctor
        run: python skills.py doctor

      # End-to-end: the runner has no symlink privilege (same as a normal user
      # shell), so this is exactly the path that must fall back to a junction.
      - name: Install / status / uninstall round-trip
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dsh-home
        run: |
          python skills.py install --agent dsh --skill iridescent-glass-ui
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $link = Join-Path $env:DSH_HOME "skills\iridescent-glass-ui"
          if (-not (Test-Path $link)) { throw "skill link missing after install" }
          python skills.py status --agent dsh --skill iridescent-glass-ui
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          python skills.py uninstall --agent dsh --skill iridescent-glass-ui
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          if (Test-Path (Join-Path $env:DSH_HOME "skills\iridescent-glass-ui")) {
            throw "link still present after uninstall"
          }
          echo "✅ junction install/status/uninstall round-trip clean"
